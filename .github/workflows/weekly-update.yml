name: Weekly arXiv update

on:
  schedule:
    # Mondays at 00:00 UTC (08:00 Beijing time). GitHub may delay scheduled
    # workflows by minutes to hours under load. Trigger manually from the
    # Actions tab if the cron has been quiet, and note that GitHub disables
    # schedules after 60 days of inactivity on the default branch.
    - cron: '0 0 * * MON'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new arXiv papers (last 7 days)
        run: python scripts/arxiv_fetch.py --days 7

      - name: Detect generated queue
        id: detect
        run: |
          today=$(date -u +%Y-%m-%d)
          file="outputs/new_papers_${today}.md"
          if [ -f "$file" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$file" >> "$GITHUB_OUTPUT"
            echo "date=$today" >> "$GITHUB_OUTPUT"
            echo "Found: $file"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new papers this week — skipping PR."
          fi

      - name: Force-stage output (bypass .gitignore)
        if: steps.detect.outputs.found == 'true'
        run: git add -f "${{ steps.detect.outputs.file }}"

      - name: Create pull request
        if: steps.detect.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: weekly-update/${{ steps.detect.outputs.date }}
          base: main
          title: 'chore: weekly arXiv update — ${{ steps.detect.outputs.date }}'
          commit-message: 'chore: add weekly arXiv review queue'
          delete-branch: true
          body: |
            Auto-generated by `.github/workflows/weekly-update.yml`.

            **To triage this queue:**
            1. Read `outputs/new_papers_${{ steps.detect.outputs.date }}.md`.
            2. For each approved paper, copy its draft JSON entry into `data/papers.json`. Fill in `category`, `domain`, `key_idea`, `trainable_params_ratio`, `open_source`, and (if known) `code_url`.
            3. Run `python scripts/generate_md.py` to refresh category markdown.
            4. Append any unverified fields to `data/TODO_VERIFY.md`.
            5. Delete the queue file before merging, or keep it for archive.

            **False positives**: phrase search may match papers whose abstracts reference PEFT only as baseline. Skip those.
